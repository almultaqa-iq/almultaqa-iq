<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الملتقى كافيه | ALMULTAQA CAFE</title>
<meta name="description" content="الملتقى كافيه – العراق، ذي قار، قلعة سكر. المنيو، بطاقة الولاء، وحساباتنا.">
<meta name="theme-color" content="#F6EBDD">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--orange:#E97828;--dark:#292522;--cream:#F6EBDD;--olive:#6F7650}
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Markazi Text',serif;font-size:18px;
    background:var(--cream);color:var(--dark);
    min-height:100vh;display:flex;justify-content:center;
    padding:44px 22px 32px;
  }
  .wrap{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;text-align:center}
  .logo{width:86%;max-width:320px;height:auto;display:block}
  .tag{font-size:21px;color:var(--olive);margin-top:18px;font-weight:500}
  .rule{display:flex;align-items:center;gap:10px;width:60%;margin:22px 0 30px}
  .rule i{flex:1;height:1px;background:rgba(41,37,34,.18)}
  .rule b{width:8px;height:8px;background:var(--orange);transform:rotate(45deg)}

  .btn{
    display:flex;align-items:center;gap:16px;width:100%;
    padding:18px 20px;margin-bottom:14px;border-radius:18px;
    text-decoration:none;transition:transform .15s ease;
  }
  .btn:active{transform:scale(.98)}
  .btn .ic{width:52px;height:52px;flex-shrink:0;border-radius:14px;display:flex;align-items:center;justify-content:center}
  .btn .ic svg{width:27px;height:27px}
  .btn .t{text-align:right;flex:1}
  .btn .t b{display:block;font-size:27px;font-weight:700;line-height:1.3}
  .btn .t span{font-size:17px;opacity:.85}
  .btn .arr{width:20px;height:20px;opacity:.7}
  .menu{background:var(--orange);color:#fff;box-shadow:0 8px 22px rgba(233,120,40,.28)}
  .menu .ic{background:rgba(255,255,255,.2)}
  .card{background:var(--dark);color:var(--cream);box-shadow:0 8px 22px rgba(41,37,34,.22)}
  .card .ic{background:var(--olive)}

  .label{font-size:18px;color:var(--olive);margin:26px 0 14px;font-weight:500;letter-spacing:.3px}
  .social{display:flex;justify-content:center;gap:14px}
  .social a{
    width:54px;height:54px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:#fff;color:var(--dark);
    border:1px solid rgba(41,37,34,.1);
    transition:background .15s,color .15s;
  }
  .social a:active,.social a:hover{background:var(--olive);color:var(--cream)}
  .social svg{width:24px;height:24px}

  .contact{display:flex;gap:12px;width:100%;margin-top:18px}
  .contact a{
    flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
    padding:14px 10px;border-radius:14px;text-decoration:none;
    font-size:20px;font-weight:600;
    border:1.5px solid var(--olive);color:var(--olive);background:transparent;
  }
  .contact a svg{width:20px;height:20px}
  .contact a.wa{background:var(--olive);color:var(--cream)}
  .num{direction:ltr;unicode-bidi:embed;font-size:18px;color:var(--dark);opacity:.7;margin-top:12px}

  .foot{margin-top:30px;font-size:17px;color:var(--dark);opacity:.55;line-height:1.8}
  .foot .h{direction:ltr;unicode-bidi:embed}
</style>
</head>
